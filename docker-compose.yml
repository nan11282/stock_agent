services:
  agent:
    build: .
    stdin_open: true
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DEEPSEEK_API_KEY_stock_agent=${DEEPSEEK_API_KEY_stock_agent}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-pro}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-600}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-0}
      - LLM_ANALYSIS_MAX_ATTEMPTS=${LLM_ANALYSIS_MAX_ATTEMPTS:-3}
      - LLM_ANALYSIS_RETRY_DELAY_SECONDS=${LLM_ANALYSIS_RETRY_DELAY_SECONDS:-2}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DB_PATH=${DB_PATH:-/app/data/investment_live.db}
      - SQLITE_JOURNAL_MODE=${SQLITE_JOURNAL_MODE:-DELETE}
      - CHROMA_PATH=/app/chroma_db
      - HF_HOME=/root/.cache/huggingface
      - RERANK_ENABLED=${RERANK_ENABLED:-false}
      - RERANK_MODEL=${RERANK_MODEL:-BAAI/bge-reranker-base}
      - RERANK_POOL_SIZE=${RERANK_POOL_SIZE:-12}
      - AGENT_READ_TOOL_ROUNDS=${AGENT_READ_TOOL_ROUNDS:-1}
      - HTTP_PROXY=http://host.docker.internal:7890
      - HTTPS_PROXY=http://host.docker.internal:7890
      - NO_PROXY=localhost,127.0.0.1
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./model_cache:/root/.cache/huggingface
      - .:/app                       # 代码热挂载：改完直接重跑，无需 rebuild

  scheduler:
    build: .
    command: [ "python", "app/scheduler.py" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DEEPSEEK_API_KEY_stock_agent=${DEEPSEEK_API_KEY_stock_agent}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-pro}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-600}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-0}
      - LLM_ANALYSIS_MAX_ATTEMPTS=${LLM_ANALYSIS_MAX_ATTEMPTS:-3}
      - LLM_ANALYSIS_RETRY_DELAY_SECONDS=${LLM_ANALYSIS_RETRY_DELAY_SECONDS:-2}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DB_PATH=${DB_PATH:-/app/data/investment_live.db}
      - SQLITE_JOURNAL_MODE=${SQLITE_JOURNAL_MODE:-DELETE}
      - CHROMA_PATH=/app/chroma_db
      - HF_HOME=/root/.cache/huggingface
      - RERANK_ENABLED=${RERANK_ENABLED:-false}
      - RERANK_MODEL=${RERANK_MODEL:-BAAI/bge-reranker-base}
      - RERANK_POOL_SIZE=${RERANK_POOL_SIZE:-12}
      - AGENT_READ_TOOL_ROUNDS=${AGENT_READ_TOOL_ROUNDS:-1}
      - MAIL_HOST=${MAIL_HOST:-smtp.qq.com}
      - MAIL_PORT=${MAIL_PORT:-465}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
      - MAIL_TO=${MAIL_TO}
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_TIMEOUT_SECONDS=${TELEGRAM_CHAT_TIMEOUT_SECONDS:-1800}
      - TELEGRAM_AGENT_MAX_STEPS=${TELEGRAM_AGENT_MAX_STEPS:-8}
      - TELEGRAM_CONNECTION_POOL_SIZE=${TELEGRAM_CONNECTION_POOL_SIZE:-32}
      - TELEGRAM_GET_UPDATES_POOL_SIZE=${TELEGRAM_GET_UPDATES_POOL_SIZE:-8}
      - TELEGRAM_POOL_TIMEOUT_SECONDS=${TELEGRAM_POOL_TIMEOUT_SECONDS:-30}
      - TELEGRAM_CONNECT_TIMEOUT_SECONDS=${TELEGRAM_CONNECT_TIMEOUT_SECONDS:-30}
      - TELEGRAM_READ_TIMEOUT_SECONDS=${TELEGRAM_READ_TIMEOUT_SECONDS:-60}
      - HTTP_PROXY=http://host.docker.internal:7890
      - HTTPS_PROXY=http://host.docker.internal:7890
      - NO_PROXY=localhost,127.0.0.1
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./model_cache:/root/.cache/huggingface
      - .:/app
    restart: unless-stopped

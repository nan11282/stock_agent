services:
  agent:
    build: .
    stdin_open: true
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DEEPSEEK_API_KEY_stock_agent=${DEEPSEEK_API_KEY_stock_agent}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DB_PATH=/app/data/investment.db
      - CHROMA_PATH=/app/chroma_db
      - HTTP_PROXY=http://host.docker.internal:7890
      - HTTPS_PROXY=http://host.docker.internal:7890
      - NO_PROXY=localhost,127.0.0.1
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - .:/app                       # 代码热挂载：改完直接重跑，无需 rebuild

  scheduler:
    build: .
    command: [ "python", "app/scheduler.py" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DEEPSEEK_API_KEY_stock_agent=${DEEPSEEK_API_KEY_stock_agent}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DB_PATH=/app/data/investment.db
      - CHROMA_PATH=/app/chroma_db
      - MAIL_HOST=${MAIL_HOST:-smtp.qq.com}
      - MAIL_PORT=${MAIL_PORT:-465}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
      - MAIL_TO=${MAIL_TO}
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - HTTP_PROXY=http://host.docker.internal:7890
      - HTTPS_PROXY=http://host.docker.internal:7890
      - NO_PROXY=localhost,127.0.0.1
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - .:/app
    restart: unless-stopped
